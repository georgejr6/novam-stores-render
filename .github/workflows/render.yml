name: render
on:
  push:
    paths: [".github/workflows/render.yml"]
  schedule:
    - cron: "*/10 * * * *" # poll the store API for queued render jobs (free on a public repo)
  workflow_dispatch:
    inputs:
      samples:
        description: "Sample jobs to make (comma list from samples/jobs, e.g. tee,mug). Empty = poll the API."
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: render
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Claim jobs
        id: claim
        if: ${{ github.event.inputs.samples == '' }}
        env:
          RENDER_API_BASES: ${{ vars.RENDER_API_BASES }}
          RENDER_WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET }}
        run: python worker/poll.py claim work
      - name: Decide
        id: need
        env:
          SAMPLES: ${{ github.event.inputs.samples }}
          CLAIMED: ${{ steps.claim.outputs.count }}
        run: |
          if [ -n "$SAMPLES" ] || { [ -n "$CLAIMED" ] && [ "$CLAIMED" != "0" ]; }; then echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - name: Render samples
        if: github.event.inputs.samples != ''
        env:
          SAMPLES: ${{ github.event.inputs.samples }}
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
        run: |
          printf '%s' "$SAMPLES" | grep -Eq '^[a-z0-9,-]+$' || { echo "bad samples list"; exit 1; }
          set -f
          for s in $(printf '%s' "$SAMPLES" | tr ',' ' '); do
            python worker/render_job.py "samples/jobs/$s.json" out
          done
      - name: Render claimed jobs
        if: github.event.inputs.samples == '' && steps.need.outputs.go == '1'
        env:
          RENDER_API_BASES: ${{ vars.RENDER_API_BASES }}
          RENDER_WORKER_SECRET: ${{ secrets.RENDER_WORKER_SECRET }}
          PRINTFUL_API_TOKEN: ${{ secrets.PRINTFUL_API_TOKEN }}
        run: python worker/poll.py render work
      - uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.samples != ''
        with:
          name: renders
          path: out/*.png
